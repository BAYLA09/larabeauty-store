name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://larabeauty.store
  NEXT_PUBLIC_GOOGLE_SHEETS_WEBHOOK_URL: https://script.google.com/macros/s/AKfycbxmRpjD1uGAfwWMzPbmKvA47kKygi1i6RQSD7R6dck6MiwI036ZYe8jG3HtOI_uFPZBIw/exec
  NEXT_PUBLIC_SHEETS_WEBHOOK_SECRET: lara-beauty-secret-2026
  DEPLOY_WEBHOOK_SECRET: lara-beauty-secret-2026

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build static export (gh-pages backup)
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 1

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger larabeauty.store deploy webhook
        continue-on-error: true
        run: |
          echo "→ Calling production deploy webhook..."
          curl -sf -m 30 -X POST https://larabeauty.store/api/deploy \
            -H "Authorization: Bearer ${{ env.DEPLOY_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions","branch":"main"}' \
            && echo "✓ Production deploy triggered" \
            || echo "⚠ Webhook not ready yet (first deploy needs SSH)"

      - name: SSH deploy to VPS (187.124.12.89)
        if: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 187.124.12.89
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            for d in /var/www/larabeauty-store /root/larabeauty-store /home/ubuntu/larabeauty-store; do
              if [ -d "$d/.git" ]; then cd "$d" && break; fi
            done
            git fetch origin main
            git reset --hard origin/main
            bash scripts/deploy-production.sh

  deploy-gh-pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - name: Push static backup to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          cname: larabeauty.store
